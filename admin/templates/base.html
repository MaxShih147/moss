<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>{% block title %}Danny Bot 管理{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { padding-top: 56px; background-color: #f8f9fa; }
  .status-new { background-color: #fff3cd; }
  .status-assigned { background-color: #cce5ff; }
  .status-inprogress { background-color: #d1ecf1; }
  .status-done { background-color: #f1f1f1; color: #666; }
  .status-rejected { background-color: #f8d7da; }
  .description-cell { max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats-card { border: none; border-radius: 8px; }
  pre.reply-log { white-space: pre-wrap; background: #f0f0f0; padding: 0.75em; border-radius: 4px; font-size: 0.9em; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/tickets">🤖 Danny Bot 管理</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/tickets">工單</a></li>
        <li class="nav-item"><a class="nav-link" href="/systems">權責表</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container-fluid mt-3">
  {% block content %}{% endblock %}
</main>
</body>
</html>

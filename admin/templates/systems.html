{% extends "base.html" %}
{% block title %}權責表{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>權責表</h3>
  <div class="text-muted small">改完存檔後，bot 的新工單指派和答題「當前負責人」會立刻使用新設定。</div>
</div>

<form method="post" action="/systems/update">
<div class="table-responsive shadow-sm">
<table class="table table-bordered bg-white mb-0">
  <thead class="table-dark">
    <tr>
      <th style="width: 20%">系統</th>
      <th style="width: 20%">主要負責人</th>
      <th style="width: 20%">備援</th>
      <th style="width: 20%">類別</th>
    </tr>
  </thead>
  <tbody>
    {% for s in systems %}
    <tr>
      <td><input type="text" name="title" class="form-control form-control-sm" value="{{ s.title }}"></td>
      <td><input type="text" name="primary_owner" class="form-control form-control-sm" value="{{ s.primary_owner }}"></td>
      <td><input type="text" name="backup_owner" class="form-control form-control-sm" value="{{ s.backup_owner }}"></td>
      <td><input type="text" name="category" class="form-control form-control-sm" value="{{ s.category }}"></td>
    </tr>
    {% endfor %}
    <tr class="table-light">
      <td><input type="text" name="title" class="form-control form-control-sm" placeholder="新增系統…"></td>
      <td><input type="text" name="primary_owner" class="form-control form-control-sm" placeholder="負責人"></td>
      <td><input type="text" name="backup_owner" class="form-control form-control-sm" placeholder="備援"></td>
      <td><input type="text" name="category" class="form-control form-control-sm" placeholder="類別"></td>
    </tr>
  </tbody>
</table>
</div>
<button class="btn btn-primary mt-3">儲存</button>
</form>
{% endblock %}
